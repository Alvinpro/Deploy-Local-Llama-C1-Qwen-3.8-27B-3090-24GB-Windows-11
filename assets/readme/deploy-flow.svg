<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="df-title df-desc">
  <title id="df-title">一键部署流程</title>
  <desc id="df-desc">五阶段流水线：双击 deploy_and_run.bat 启动，自动环境检查（Windows 10/11、驱动 ≥550、CUDA 12.4），拉取 llama.cpp CUDA 构建，下载 UD-Q4_K_XL 权重约 17.6GB 与 MTP 解码头约 1.68GB，最后启动 llama-server 于 0.0.0.0:8080，提供 OpenAI 兼容接口。</desc>

  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="420" rx="24" fill="#0C0E12"/>

  <!-- header -->
  <rect x="56" y="56" width="8" height="8" rx="2" fill="#46C486"/>
  <text x="74" y="65" class="mono" font-size="18" letter-spacing="0.12em" fill="#8A919C">DEPLOY PIPELINE · 一键部署流程</text>
  <text x="1144" y="65" class="mono" font-size="16" fill="#8A919C" text-anchor="end">deploy_and_run.bat 全程自动</text>

  <!-- arrows between cards -->
  <g id="arrows" stroke="#2A3140" stroke-width="2">
    <line x1="254" y1="235" x2="267" y2="235"/>
    <line x1="479" y1="235" x2="492" y2="235"/>
    <line x1="704" y1="235" x2="717" y2="235"/>
    <line x1="929" y1="235" x2="942" y2="235"/>
  </g>
  <g id="arrowheads" fill="#2A3140">
    <path d="M275 235 L267 230 L267 240 Z"/>
    <path d="M500 235 L492 230 L492 240 Z"/>
    <path d="M725 235 L717 230 L717 240 Z"/>
    <path d="M950 235 L942 230 L942 240 Z"/>
  </g>

  <!-- stage 01 -->
  <g id="stage-01">
    <rect x="50" y="140" width="200" height="190" rx="12" fill="#14181E" stroke="#2A3140"/>
    <text x="66" y="174" class="mono" font-size="15" fill="#8A919C">01</text>
    <text x="66" y="208" class="sans" font-size="21" font-weight="600" fill="#F4F5F7">双击启动</text>
    <text x="66" y="244" class="mono" font-size="14" fill="#B9BEC6">deploy_and_run.bat</text>
    <text x="66" y="272" class="mono" font-size="16" fill="#8A919C">自动完成后续全部步骤</text>
  </g>

  <!-- stage 02 -->
  <g id="stage-02">
    <rect x="275" y="140" width="200" height="190" rx="12" fill="#14181E" stroke="#2A3140"/>
    <text x="291" y="174" class="mono" font-size="15" fill="#8A919C">02</text>
    <text x="291" y="208" class="sans" font-size="21" font-weight="600" fill="#F4F5F7">环境检查</text>
    <text x="291" y="244" class="mono" font-size="16" fill="#B9BEC6">Windows 10/11</text>
    <text x="291" y="272" class="mono" font-size="16" fill="#8A919C">驱动 ≥550 · CUDA 12.4</text>
    <text x="291" y="300" class="mono" font-size="16" fill="#8A919C">磁盘空间 ~20GB</text>
  </g>

  <!-- stage 03 -->
  <g id="stage-03">
    <rect x="500" y="140" width="200" height="190" rx="12" fill="#14181E" stroke="#2A3140"/>
    <text x="516" y="174" class="mono" font-size="15" fill="#8A919C">03</text>
    <text x="516" y="208" class="sans" font-size="21" font-weight="600" fill="#F4F5F7">拉取推理引擎</text>
    <text x="516" y="244" class="mono" font-size="16" fill="#B9BEC6">llama.cpp CUDA 构建</text>
    <text x="516" y="272" class="mono" font-size="16" fill="#8A919C">自动选版 · 断点续传</text>
  </g>

  <!-- stage 04 -->
  <g id="stage-04">
    <rect x="725" y="140" width="200" height="190" rx="12" fill="#14181E" stroke="#2A3140"/>
    <text x="741" y="174" class="mono" font-size="15" fill="#8A919C">04</text>
    <text x="741" y="208" class="sans" font-size="21" font-weight="600" fill="#F4F5F7">下载模型</text>
    <text x="741" y="244" class="mono" font-size="16" fill="#B9BEC6">Q4_K_XL ~17.6GB</text>
    <text x="741" y="272" class="mono" font-size="16" fill="#8A919C">MTP 解码头 ~1.68GB</text>
  </g>

  <!-- stage 05 -->
  <g id="stage-05">
    <rect x="950" y="140" width="200" height="190" rx="12" fill="#14181E" stroke="#2A3140"/>
    <text x="966" y="174" class="mono" font-size="15" fill="#46C486">05</text>
    <text x="966" y="208" class="sans" font-size="21" font-weight="600" fill="#F4F5F7">启动服务</text>
    <text x="966" y="244" class="mono" font-size="16" fill="#B9BEC6">llama-server</text>
    <text x="966" y="272" class="mono" font-size="16" fill="#46C486">0.0.0.0:8080</text>
    <text x="966" y="300" class="mono" font-size="16" fill="#8A919C">OpenAI 兼容 /v1</text>
  </g>

  <!-- footer -->
  <text x="56" y="372" class="mono" font-size="16" fill="#8A919C">双击后自动完成环境检查、下载与启动，无需手动配置</text>
</svg>
