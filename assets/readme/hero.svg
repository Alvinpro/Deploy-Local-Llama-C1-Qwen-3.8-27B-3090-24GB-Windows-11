<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Qwen3.8-27B 本地部署（单卡 RTX 3090 / Windows）</title>
  <desc id="hero-desc">标题区：Qwen3.8-27B 单卡 3090 一键部署，OpenAI 兼容服务；右侧终端演示双击 deploy_and_run.bat 后 llama-server 在 0.0.0.0:8080 监听，显存约 23GB / 24GB。</desc>

  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="420" rx="24" fill="#0C0E12"/>

  <!-- ================= left: identity ================= -->
  <g id="title-block">
    <rect x="56" y="56" width="8" height="8" rx="2" fill="#46C486"/>
    <text x="74" y="65" class="mono" font-size="18" letter-spacing="0.12em" fill="#8A919C">WINDOWS · SINGLE GPU · ONE-CLICK</text>

    <text x="56" y="132" class="sans" font-size="52" font-weight="700" fill="#F4F5F7">Qwen3.8-27B 本地部署</text>
    <text x="56" y="172" class="sans" font-size="21" fill="#8A919C">单卡 RTX 3090 24GB · 双击部署 · OpenAI 兼容服务</text>

    <text x="56" y="214" class="sans" font-size="20" fill="#B9BEC6">一键拉取 llama.cpp CUDA 构建 + Q4_K_XL 模型，</text>
    <text x="56" y="246" class="sans" font-size="20" fill="#B9BEC6">叠加 MTP 推测解码，启动局域网可访问的推理服务。</text>

    <!-- spec chips -->
    <g id="spec-chips">
      <rect x="56" y="276" width="110" height="38" rx="10" fill="#14181E" stroke="#2A3140"/>
      <circle cx="76" cy="295" r="4" fill="#46C486"/>
      <text x="88" y="301" class="mono" font-size="18" fill="#F4F5F7">47 t/s</text>

      <rect x="178" y="276" width="161" height="38" rx="10" fill="#14181E" stroke="#2A3140"/>
      <text x="192" y="301" class="mono" font-size="18" fill="#F4F5F7">MTP 1.5× 无损</text>

      <rect x="351" y="276" width="98" height="38" rx="10" fill="#14181E" stroke="#2A3140"/>
      <text x="365" y="301" class="mono" font-size="18" fill="#F4F5F7">96K ctx</text>

      <rect x="461" y="276" width="175" height="38" rx="10" fill="#14181E" stroke="#2A3140"/>
      <text x="475" y="301" class="mono" font-size="18" fill="#F4F5F7">Q4_K_XL 17.6GB</text>
    </g>

    <text x="56" y="356" class="mono" font-size="16" fill="#8A919C">RTX 3090 24GB · Windows 10/11 · 一键部署/启动 · 首次下载 ~20GB</text>
  </g>

  <!-- ================= right: project-native terminal ================= -->
  <g id="terminal">
    <rect x="664" y="48" width="480" height="324" rx="14" fill="#14181E" stroke="#2A3140"/>
    <!-- title bar -->
    <path d="M664 62 a14 14 0 0 1 14 -14 h452 a14 14 0 0 1 14 14 v26 h-480 z" fill="#1A2029"/>
    <line x1="664" y1="88" x2="1144" y2="88" stroke="#2A3140"/>
    <rect x="686" y="63" width="10" height="10" rx="2" fill="#46C486"/>
    <text x="706" y="74" class="mono" font-size="15" fill="#8A919C">llama-3090 — llama-server</text>
    <circle cx="1122" cy="68" r="4" fill="#46C486"/>
    <text x="1112" y="74" class="mono" font-size="15" fill="#46C486" text-anchor="end">RUNNING</text>

    <!-- lines -->
    <text x="688" y="126" class="mono" font-size="19"><tspan fill="#8A919C">PS C:\llama-3090&gt;</tspan><tspan fill="#F4F5F7"> .\deploy_and_run.bat</tspan></text>
    <text x="688" y="160" class="mono" font-size="19"><tspan fill="#46C486">[ok]</tspan><tspan fill="#B9BEC6"> llama.cpp CUDA build + cudart</tspan></text>
    <text x="688" y="194" class="mono" font-size="19"><tspan fill="#46C486">[ok]</tspan><tspan fill="#B9BEC6"> Qwen3.8-27B-UD-Q4_K_XL.gguf</tspan></text>
    <text x="1120" y="194" class="mono" font-size="19" fill="#8A919C" text-anchor="end">17.6GB</text>
    <text x="688" y="228" class="mono" font-size="19"><tspan fill="#46C486">[ok]</tspan><tspan fill="#B9BEC6"> mtp-Qwen3.8-27B-Q4_0.gguf</tspan></text>
    <text x="1120" y="228" class="mono" font-size="19" fill="#8A919C" text-anchor="end">1.68GB</text>
    <text x="688" y="262" class="mono" font-size="19" fill="#46C486">llama-server: http://0.0.0.0:8080</text>
    <text x="688" y="296" class="mono" font-size="19" fill="#8A919C">OpenAI 兼容 · /v1 · 局域网可访问 </text>

    <!-- VRAM gauge -->
    <g id="vram-gauge">
      <text x="688" y="342" class="mono" font-size="16" fill="#8A919C">VRAM</text>
      <rect x="744" y="330" width="281.6" height="10" rx="5" fill="#222936"/>
      <rect x="744" y="330" width="269.6" height="10" rx="5" fill="#46C486"/>
      <text x="1120" y="342" class="mono" font-size="16" fill="#B9BEC6" text-anchor="end">≈ 23GB/24GB</text>
    </g>
  </g>
</svg>
